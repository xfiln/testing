<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JKT48 · IDN Live Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Newsreader:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ── RESET & BASE ─────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --black: #05040a;
  --ink:   #0e0c18;
  --panel: #13111f;
  --card:  #181525;
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(232,0,80,0.35);
  --red:   #e80050;
  --red-glow: rgba(232,0,80,0.18);
  --pink:  #ff3373;
  --gold:  #ffb938;
  --text:  #ede8ff;
  --muted: #6b6480;
  --dim:   #302c44;
}

html { scroll-behavior: smooth; }

body {
  background: var(--black);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: default;
}

/* ── BACKGROUND ATMOSPHERE ──────────────────── */
.bg-atm {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
}
.bg-atm::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(232,0,80,0.14) 0%, transparent 65%),
    radial-gradient(ellipse 40% 40% at 90% 90%, rgba(100,0,180,0.08) 0%, transparent 60%);
}
.bg-atm::after {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(232,0,80,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,0,80,0.035) 1px, transparent 1px);
  background-size: 56px 56px;
}

/* Floating orbs */
.orb {
  position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0;
  animation: drift 20s ease-in-out infinite;
}
.orb1 { width: 400px; height: 400px; top: -150px; left: -100px; background: radial-gradient(circle, rgba(232,0,80,0.07), transparent 70%); animation-delay: 0s; }
.orb2 { width: 300px; height: 300px; bottom: -100px; right: 100px; background: radial-gradient(circle, rgba(120,0,220,0.06), transparent 70%); animation-delay: -8s; }
@keyframes drift {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(30px, -20px); }
  66% { transform: translate(-20px, 30px); }
}

/* ── NAV ────────────────────────────────────── */
nav {
  position: relative; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 28px 48px;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  background: rgba(5,4,10,0.6);
  position: sticky; top: 0;
}

.nav-brand {
  display: flex; align-items: center; gap: 14px;
}

.brand-mark {
  width: 40px; height: 40px;
  background: var(--red);
  clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 500; color: #fff; letter-spacing: 0.5px;
  box-shadow: 0 0 20px rgba(232,0,80,0.5);
  animation: hexPulse 3s ease-in-out infinite;
}
@keyframes hexPulse {
  0%,100% { box-shadow: 0 0 20px rgba(232,0,80,0.4); }
  50% { box-shadow: 0 0 35px rgba(232,0,80,0.7), 0 0 60px rgba(232,0,80,0.2); }
}

.brand-text { line-height: 1; }
.brand-name {
  font-family: 'Newsreader', serif;
  font-size: 22px; font-weight: 400; color: var(--text); letter-spacing: -0.3px;
}
.brand-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--red); letter-spacing: 3px; text-transform: uppercase;
}

.nav-right { display: flex; align-items: center; gap: 16px; }

.live-pill {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 14px;
  border: 1px solid rgba(232,0,80,0.3);
  border-radius: 999px;
  background: rgba(232,0,80,0.08);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--pink); letter-spacing: 2px;
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--red);
  animation: blink 1.1s step-start infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.btn-refresh {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 18px;
  border: 1px solid var(--border); border-radius: 6px;
  background: transparent; color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 1px; cursor: pointer;
  transition: border-color .2s, color .2s, background .2s;
}
.btn-refresh:hover { border-color: var(--red); color: var(--pink); background: var(--red-glow); }
.btn-refresh.spin svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── HERO ────────────────────────────────────── */
.hero {
  position: relative; z-index: 10;
  padding: 72px 48px 48px;
  max-width: 1200px;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase;
  margin-bottom: 20px;
}
.hero-eyebrow::before {
  content: '';
  display: block; width: 24px; height: 1px; background: var(--gold);
}
.hero h1 {
  font-family: 'Newsreader', serif;
  font-size: clamp(44px, 7vw, 86px);
  font-weight: 300; line-height: 1.04; letter-spacing: -1px;
  color: var(--text);
  max-width: 700px;
}
.hero h1 em {
  font-style: italic; color: var(--red);
  font-weight: 300;
  text-shadow: 0 0 40px rgba(232,0,80,0.4);
}
.hero-divider {
  width: 64px; height: 1px;
  background: linear-gradient(90deg, var(--red), transparent);
  margin: 36px 0 32px;
}

/* Stats */
.stats {
  display: flex; flex-wrap: wrap; gap: 48px;
}
.stat {}
.stat-n {
  font-family: 'Newsreader', serif;
  font-size: 48px; line-height: 1; color: var(--text);
  font-weight: 300;
}
.stat-n span { color: var(--red); }
.stat-l {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
  margin-top: 4px;
}

/* ── SECTION ─────────────────────────────────── */
.section {
  position: relative; z-index: 10;
  padding: 8px 48px 72px;
}
.section-bar {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 28px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted);
}
.section-rule { flex: 1; height: 1px; background: var(--border); }
.section-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--red);
  background: rgba(232,0,80,0.1);
  border: 1px solid rgba(232,0,80,0.2);
  padding: 3px 10px; border-radius: 2px;
}

/* ── GRID ────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
  gap: 18px;
}

/* ── CARD ────────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden;
  cursor: pointer;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), border-color .25s;
  animation: fadeUp .5s ease both;
  position: relative;
}
.card::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: 10px;
  opacity: 0;
  background: linear-gradient(135deg, rgba(232,0,80,0.06), transparent);
  transition: opacity .3s;
  pointer-events: none;
  z-index: 1;
}
.card:hover { transform: translateY(-6px); border-color: var(--border-hover); }
.card:hover::before { opacity: 1; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Thumb */
.card-thumb {
  position: relative; aspect-ratio: 16/9; overflow: hidden;
  background: var(--panel);
}
.card-thumb img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform .5s ease;
}
.card:hover .card-thumb img { transform: scale(1.08); }

.card-thumb-ph {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--panel) 0%, #200820 100%);
  font-family: 'Newsreader', serif;
  font-size: 44px; font-style: italic; font-weight: 300;
  color: rgba(232,0,80,0.35);
}

/* Overlays */
.tag-live {
  position: absolute; top: 10px; left: 10px; z-index: 2;
  display: flex; align-items: center; gap: 6px;
  background: var(--red);
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px; letter-spacing: 2px; padding: 4px 9px; border-radius: 3px;
  box-shadow: 0 2px 12px rgba(232,0,80,0.5);
}
.tag-live .d { width: 5px; height: 5px; border-radius: 50%; background: #fff; animation: blink 1s step-start infinite; }

.tag-viewers {
  position: absolute; bottom: 10px; right: 10px; z-index: 2;
  display: flex; align-items: center; gap: 5px;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(8px);
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; padding: 4px 10px; border-radius: 4px;
}

/* Body */
.card-body { padding: 16px 18px 18px; }
.card-name {
  font-family: 'Newsreader', serif;
  font-size: 18px; font-weight: 400; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 3px;
}
.card-title {
  font-size: 12px; color: var(--muted); font-weight: 400;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 14px;
}
.card-footer {
  display: flex; align-items: center; justify-content: space-between;
}
.card-dur {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--gold);
}
.btn-watch {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--pink); text-decoration: none;
  border: 1px solid rgba(232,0,80,0.25);
  padding: 5px 13px; border-radius: 3px;
  transition: background .2s, color .2s, border-color .2s;
  position: relative; z-index: 3;
}
.btn-watch:hover { background: var(--red); color: #fff; border-color: var(--red); }

/* ── STATES ──────────────────────────────────── */
.state-wrap {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 16px; padding: 100px 40px; text-align: center;
}

/* Loading */
.loader {
  width: 44px; height: 44px;
  border: 2px solid rgba(232,0,80,0.15);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin .85s linear infinite;
}
.state-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted);
}

/* Empty */
.empty-ico { font-size: 48px; opacity: .35; }
.empty-title {
  font-family: 'Newsreader', serif;
  font-size: 26px; font-weight: 300; font-style: italic; color: var(--text);
}
.empty-sub { font-size: 13px; color: var(--muted); }

/* Error */
.error-wrap {
  margin: 0 48px;
  padding: 48px;
  border: 1px solid rgba(232,0,80,0.2);
  border-radius: 10px;
  background: rgba(232,0,80,0.04);
  text-align: center;
}
.error-title {
  font-family: 'Newsreader', serif;
  font-size: 24px; font-style: italic; color: var(--red); margin-bottom: 8px;
}
.error-msg {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; color: var(--muted); margin-bottom: 20px;
}
.error-hint {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--dim);
  background: rgba(0,0,0,0.35);
  border: 1px solid var(--border);
  padding: 12px 20px; border-radius: 6px; line-height: 1.7;
}
.error-hint code { color: var(--text); }

/* ── FOOTER ──────────────────────────────────── */
footer {
  position: relative; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  padding: 24px 48px;
  border-top: 1px solid var(--border);
}
.foot-l, .foot-r {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--muted); letter-spacing: .5px;
}
.foot-l a { color: var(--pink); text-decoration: none; }
.foot-l a:hover { text-decoration: underline; }

/* ── RESPONSIVE ──────────────────────────────── */
@media (max-width: 640px) {
  nav { padding: 20px; }
  .hero, .section { padding-left: 20px; padding-right: 20px; }
  .hero h1 { font-size: 36px; }
  .stats { gap: 28px; }
  .error-wrap { margin: 0 20px; padding: 28px 20px; }
  footer { padding: 20px; }
}
</style>
</head>
<body>

<div class="bg-atm"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- NAV -->
<nav>
  <div class="nav-brand">
    <div class="brand-mark">JKT</div>
    <div class="brand-text">
      <div class="brand-name">JKT48</div>
      <div class="brand-sub">IDN Live Tracker</div>
    </div>
  </div>
  <div class="nav-right">
    <div class="live-pill">
      <div class="live-dot"></div>
      LIVE
    </div>
    <button class="btn-refresh" id="btnRefresh" onclick="loadLives()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      REFRESH
    </button>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-eyebrow">Real-time IDN Live</div>
  <h1>Siapa yang<br>sedang <em>live</em> sekarang?</h1>
  <div class="hero-divider"></div>
  <div class="stats">
    <div class="stat">
      <div class="stat-n" id="statLive">—</div>
      <div class="stat-l">Sedang Live</div>
    </div>
    <div class="stat">
      <div class="stat-n" id="statViewers">—</div>
      <div class="stat-l">Total Penonton</div>
    </div>
    <div class="stat">
      <div class="stat-n" id="statTime">—</div>
      <div class="stat-l">Update Jam</div>
    </div>
  </div>
</div>

<!-- CONTENT SECTION -->
<div class="section">
  <div class="section-bar">
    <span class="section-label">Member Live</span>
    <div class="section-rule"></div>
    <span class="section-count" id="countBadge">— member</span>
  </div>
  <div id="content">
    <div class="state-wrap">
      <div class="loader"></div>
      <div class="state-label">Memuat data live...</div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <div class="foot-l">
    Data via <a href="https://github.com/Synxx12/idn-api-live-jkt48" target="_blank">IDN API JKT48</a> &middot; Built with Express.js
  </div>
  <div class="foot-r" id="lastUpdate">—</div>
</footer>

<script>
// ─── Helpers ───────────────────────────────────────────────
function fmtViewers(n) {
  if (!n && n !== 0) return '—';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000)    return (n / 1000).toFixed(1) + 'K';
  return String(n);
}

function fmtDuration(startedAt) {
  if (!startedAt) return '';
  const diff = Math.floor((Date.now() - new Date(startedAt)) / 60000);
  if (diff < 1)  return '< 1 mnt';
  if (diff < 60) return diff + ' mnt';
  const h = Math.floor(diff / 60), m = diff % 60;
  return `${h}j ${m}mnt`;
}

function fmtTime(d) {
  return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}

// ─── Card Render ────────────────────────────────────────────
function renderCard(m, i) {
  const delay = (i * 0.055).toFixed(2);
  const name  = m.name || 'JKT48 Member';
  const title = m.title || 'IDN Live';
  const dur   = fmtDuration(m.started_at);
  const views = m.viewers;
  const url   = m.idn_url || 'https://idn.app';
  const img   = m.thumbnail || m.avatar || '';
  const initial = name.charAt(0).toUpperCase();

  const thumb = img
    ? `<img src="${img}" alt="${name}" loading="lazy"
         onerror="this.parentElement.innerHTML='<div class=\\'card-thumb-ph\\'>${initial}</div>'">`
    : `<div class="card-thumb-ph">${initial}</div>`;

  return `
    <div class="card" style="animation-delay:${delay}s" onclick="window.open('${url}','_blank')">
      <div class="card-thumb">
        ${thumb}
        <div class="tag-live"><div class="d"></div>LIVE</div>
        ${views ? `<div class="tag-viewers">👁 ${fmtViewers(views)}</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-name">${name}</div>
        <div class="card-title">${title}</div>
        <div class="card-footer">
          <span class="card-dur">${dur ? '⏱ ' + dur : ''}</span>
          <a class="btn-watch" href="${url}" target="_blank" onclick="event.stopPropagation()">TONTON →</a>
        </div>
      </div>
    </div>`;
}

// ─── Load Lives ─────────────────────────────────────────────
async function loadLives() {
  const btn = document.getElementById('btnRefresh');
  btn.classList.add('spin');

  try {
    const res  = await fetch('/api/jkt48');
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    const json = await res.json();

    const members = json.data || [];
    const now     = new Date();

    // Update stats
    document.getElementById('statLive').textContent    = members.length;
    document.getElementById('statTime').textContent    = fmtTime(now);
    document.getElementById('lastUpdate').textContent  = 'Diperbarui: ' + now.toLocaleString('id-ID');

    const totalViewers = members.reduce((s, m) => s + (m.viewers || 0), 0);
    document.getElementById('statViewers').textContent = fmtViewers(totalViewers);
    document.getElementById('countBadge').textContent  = members.length + ' member';

    const content = document.getElementById('content');

    if (members.length === 0) {
      content.innerHTML = `
        <div class="state-wrap">
          <div class="empty-ico">📺</div>
          <div class="empty-title">Tidak ada yang live saat ini</div>
          <div class="empty-sub">Tidak ada member JKT48 yang sedang live di IDN.</div>
        </div>`;
      return;
    }

    content.innerHTML = `<div class="grid">${members.map(renderCard).join('')}</div>`;

  } catch (err) {
    console.error(err);
    document.getElementById('countBadge').textContent = 'Error';
    document.getElementById('content').innerHTML = `
      <div class="error-wrap">
        <div class="error-title">Gagal memuat data</div>
        <div class="error-msg">${err.message}</div>
        <div class="error-hint">
          Pastikan backend berjalan:<br>
          <code>npm start</code> → <code>http://localhost:3000</code><br>
          kemudian buka halaman ini dari server yang sama.
        </div>
      </div>`;
  } finally {
    btn.classList.remove('spin');
  }
}

// ─── Init ───────────────────────────────────────────────────
loadLives();
setInterval(loadLives, 60000); // auto-refresh 60 detik
</script>
</body>
</html>
